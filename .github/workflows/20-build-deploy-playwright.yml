name: Build, Deploy & Playwright

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  # A cancelled main run would never publish its screenshots, and future branches
  # compare against exactly that commit, so main runs always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_job:
    runs-on: ubuntu-latest
    name: Build Job
    steps:
      - name: Set timezone
        run: sudo timedatectl set-timezone Europe/Amsterdam

      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-build-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site
        env:
          NUXT_PUBLIC_API_BASE: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.api.bach.software', github.event.pull_request.number) || 'https://api.bach.software' }}
        run: pnpm build

      - name: Zip generated site (no compression)
        run: zip -r -0 generated-site.zip dist

      - name: Upload zipped site
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-zip
          path: generated-site.zip
          retention-days: 1

  deploy_job:
    needs: build_job
    runs-on: ubuntu-latest
    name: Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Download zipped site
        uses: actions/download-artifact@v4
        with:
          name: generated-site-zip
          path: .

      - name: Unzip generated site
        run: unzip generated-site.zip

      - name: Deploy
        id: builddeploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.100.0
          command: pages deploy dist --project-name=bach-software --branch=${{ github.ref_name }}

  playwright_job:
    needs: build_job
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --user root
    env:
      HOME: /root
    name: Perform Playwright Tests
    steps:
      # The full history is needed to find the commit a branch forked from.
      # Pull requests check out their own head instead of the synthetic merge
      # commit, so the commit status lands on the PR and the screenshots are
      # keyed by a commit the PR actually contains.
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The checkout is owned by another user than root (git refuses it
      # otherwise), and reg-suit refuses a detached HEAD, so PRs get a branch.
      - name: Prepare git for reg-suit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git checkout -B "$GITHUB_HEAD_REF"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install unzip
        run: apt-get update && apt-get install -y unzip

      # - name: Install Playwright Browsers
      #   run: pnpm exec playwright install --with-deps

      - name: Download zipped site
        uses: actions/download-artifact@v4
        with:
          name: generated-site-zip
          path: .

      - name: Unzip generated site
        run: unzip generated-site.zip

      # Captures the screenshots into visual-regression/actual and runs the
      # non-screenshot specs. The comparison happens in the reg-suit step below.
      - name: Run Playwright tests
        run: pnpm ci:playwright

      # Forks and Dependabot runs get no repository secrets: they still capture
      # and test, they just skip publishing and the visual report.
      - name: Check visual regression credentials
        id: reg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REG_NOTIFY_CLIENT_ID: ${{ secrets.REG_NOTIFY_CLIENT_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$REG_NOTIFY_CLIENT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No access to the visual regression secrets, skipping the reg-suit report."
          fi

      # Compares against the baseline of the commit this branch forked from,
      # publishes the screenshots and report, and posts the status on the PR.
      # On main it publishes the baseline that future branches compare against.
      - name: Publish visual regression report
        if: ${{ steps.reg.outputs.enabled == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REG_NOTIFY_CLIENT_ID: ${{ secrets.REG_NOTIFY_CLIENT_ID }}
        run: pnpm vrt:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Upload test-results
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 2
